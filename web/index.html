<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Learn to read Hangul, the Korean alphabet, just by playing: hunt letters, build syllables, read real words. Free in your browser.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hangul Bricks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hangul Bricks · Learn to read Hangul through play</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #F7F1E5; }
    #hq-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: sans-serif; color: #2B2622; background: #F7F1E5;
      transition: opacity .4s; z-index: 10;
    }
    #hq-splash .glyph { font-size: 88px; font-weight: 800; color: #C4463A; }
  </style>
</head>
<body>
  <div id="hq-splash"><div class="glyph">한</div><div>Hangul Bricks · Loading…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('hq-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
  <script>
    // Lemon Squeezy overlay checkout: bridge Checkout.Success to a window
    // event that lib/platform/billing/web_billing.dart listens for. The
    // detail is the restore token "<orderId>:<orderIdentifier>".
    function hqLemonReady() {
      if (window.createLemonSqueezy) window.createLemonSqueezy();
      window.LemonSqueezy.Setup({
        eventHandler: function (e) {
          if (e.event !== 'Checkout.Success' || !e.data) return;
          var token = e.data.id + ':' + (e.data.attributes || {}).identifier;
          window.dispatchEvent(new CustomEvent('hq-ls-success', { detail: token }));
        }
      });
    }
  </script>
  <script src="https://app.lemonsqueezy.com/js/lemon.js" defer onload="hqLemonReady()"></script>
  <!-- Always-visible legal/pricing links (store review + consumer info).
       Kept tiny and inside the bottom safe padding so it never covers UI. -->
  <style>
    #hq-legal {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      z-index: 20; display: flex; gap: 10px; padding: 2px 10px;
      font: 11px/16px sans-serif; background: rgba(247, 241, 229, .85);
      border-radius: 8px 8px 0 0; white-space: nowrap;
    }
    #hq-legal a { color: #6B625A; text-decoration: none; }
    #hq-legal a:hover { text-decoration: underline; }
  </style>
  <nav id="hq-legal" aria-label="Hangul Bricks links">
    <a href="/about">About</a><a href="/about#pricing">Pricing</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refund">Refunds</a>
  </nav>
  <noscript>
    <h1>Hangul Bricks: learn to read Korean (Hangul) in 7 days through play</h1>
    <p>Hangul Bricks is a browser game that teaches the Korean alphabet. Free to start; Premium is $6.99/month or $39.99/year with a 7-day free trial.</p>
    <p><a href="/about">About &amp; pricing</a> · <a href="/terms">Terms of Service</a> · <a href="/privacy">Privacy Policy</a> · <a href="/refund">Refund Policy</a></p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
