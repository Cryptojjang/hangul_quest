name: hangul_quest
description: >-
  Hangul Bricks — learn to read Hangul through play. Jamo recognition,
  syllable assembly, and word reading as core game mechanics.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/voice/jamo/
    - assets/audio/voice/syllable/
    - assets/audio/voice/word/
    - assets/audio/voice/ui/
    - assets/audio/voice/phrase/
  fonts:
    # Pretendard (SIL OFL 1.1, assets/fonts/OFL.txt) — only the weights the
    # UI uses; add a weight here before using it in a TextStyle.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
