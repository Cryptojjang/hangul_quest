name: hangul_quest
description: >-
  HangulQuest — learn to read Hangul through play. Jamo recognition,
  syllable assembly, and word reading as core game mechanics.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/voice/jamo/
    - assets/audio/voice/syllable/
    - assets/audio/voice/word/
    - assets/audio/voice/ui/
